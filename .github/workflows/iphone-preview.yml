name: Prévisualisation iPhone (branche PR #1)
on:
  push:
    branches:
      - feat/wilds-builder-advanced-20261110
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wilds-iphone-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site statique
        run: |
          mkdir -p _site
          cp index.html builder.html *.css *.mjs *.json _site/
      - name: Publier l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer la prévisualisation
        id: deployment
        uses: actions/deploy-pages@v4
